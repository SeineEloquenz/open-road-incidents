[package]
name = "open-road-incidents"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
env_logger = "0.11.11"
flate2 = "1.1.11"
log = "0.4.35"
proj4rs = "0.3.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = { version = "0.4", default-features = false }
toml = "1.2.1"
ureq = { version = "2", features = ["json"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2"] }
