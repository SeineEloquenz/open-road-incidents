flate2 = "1.1.11"
log = "0.4.35"
proj4rs = "0.3.0"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
ureq = { version = "2", features = ["json"] }
